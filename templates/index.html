<!DOCTYPE html>
<html>
<head>
    <title>Penjualan Voucher</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>

<h1>Penjualan Voucher</h1>

<form action="/beli" method="POST">

    <label>Nama:</label><br>
    <input type="text" name="nama" required><br><br>

    <label>Pilih Voucher:</label><br>
    <select name="voucher">
        <option>Voucher 10.000</option>
        <option>Voucher 20.000</option>
        <option>Voucher 50.000</option>
    </select><br><br>

    <button type="submit">Beli Sekarang</button>

</form>

</body>
</html>
